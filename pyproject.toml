[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisp_smiles"
version = "0.1.0"
authors = [
    {name = "De Novo Chem Team", email = "carson.britt@denovochem.com"}
]
description = "CRISP SMILES is a Python library for converting SMILES strings to and from a new syntax that preserves stereochemistry information."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
train = [
    "accelerate>=1.1.0",
    "numpy>=1.26.0",
    "torch>=2.1.0",
    "transformers>=4.40.0,<5.0",
    "tensorboard>=2.16.0",
]

[project.urls]
Homepage = "https://github.com/denovochem/crisp_smiles"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ["UP", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_manuscript_data.py" = ["E402"]
"scripts/experiment_definitions.py" = ["E402"]
"scripts/analyze_stereochem_flips.py" = ["E402"]
"tests/unit/test_split_dataset.py" = ["E402"]
"tests/unit/test_trainer.py" = ["E402"]
"tests/unit/test_teacher_forced_eval.py" = ["E402"]
"examples/example_notebook.ipynb" = ["E402", "F401", "F811"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]
train = [
    "accelerate>=1.1.0",
    "numpy>=1.26.0",
    "torch>=2.1.0",
    "transformers>=4.40.0,<5.0",
    "tensorboard>=2.16.0",
]
